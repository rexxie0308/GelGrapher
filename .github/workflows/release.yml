# Publishes a release with an offline copy (unzip, open index.html) and the single-file Claude artifact
# build attached. Two ways to start it:
#   - push a tag such as v1.1.0;
#   - Actions -> Release -> "Run workflow" with the version (e.g. 1.1.0): the tag is created on the chosen
#     branch if it does not exist yet. The version must match package.json.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.1.0 (must equal "version" in package.json; the tag v<version> is created if missing)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Resolve the tag
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then TAG="v$INPUT_VERSION"; else TAG="$GITHUB_REF_NAME"; fi
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$PKG" ]; then echo "::error::tag $TAG does not match package.json version $PKG"; exit 1; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "GelGrapher $TAG"
            git push origin "$TAG"
          fi
      - run: node tools/build-artifact.mjs
      - name: Package the offline app
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p GelGrapher
          cp -r index.html css js icons sw.js manifest.webmanifest LICENSE README.md GelGrapher/
          rm GelGrapher/js/uitest.js
          sed -i "s/__VERSION__/${TAG}/g" GelGrapher/sw.js
          sed -i "s/__BUILD__/${TAG}-${GITHUB_SHA:0:7}/g" GelGrapher/js/app.js
          zip -r "GelGrapher-${TAG}.zip" GelGrapher
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "GelGrapher-${TAG}.zip" dist/gelgrapher-artifact.html --clobber
          else
            gh release create "$TAG" "GelGrapher-${TAG}.zip" dist/gelgrapher-artifact.html \
              --title "GelGrapher $TAG" --notes "See CHANGELOG.md. Offline use: unzip and open index.html. The installable, self-updating version is at https://rexxie0308.github.io/GelGrapher/."
          fi
